version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: study-planner-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: study-planner-ai
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: study-planner-backend
    restart: unless-stopped
    depends_on:
      - redis
      - ai-service
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://host.docker.internal:27017/studyplanner
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      CORS_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: focusiq-local-access-secret
      JWT_REFRESH_SECRET: focusiq-local-refresh-secret
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 7d
    ports:
      - "5000:5000"
